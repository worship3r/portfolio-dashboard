<body>
<section id="lock" class="lock">
  <form id="lockForm" class="lock-card" autocomplete="on" hidden>
    <h1>내 포트폴리오</h1>
    <p id="lockHint" class="muted"></p>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호" required>
    <input id="pw2" type="password" placeholder="비밀번호 확인" autocomplete="new-password" aria-label="비밀번호 확인" hidden>
    <label class="chk"><input id="remember" type="checkbox" checked>이 기기에서 기억하기</label>
    <button id="lockBtn" class="btn primary" type="submit">열기</button>
    <p id="lockErr" class="err" role="alert"></p>
    <label id="restoreWrap" class="linkish" hidden>백업 파일로 복원<input id="restoreFile" type="file" accept=".json,application/json" hidden></label>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <strong class="brand">내 포트폴리오</strong>
      <div class="top-right">
        <span id="fxBadge" class="fx"></span>
        <div class="seg" role="group" aria-label="표시 통화">
          <button data-act="cur" data-v="KRW">₩ 원화</button>
          <button data-act="cur" data-v="USD">$ 달러</button>
        </div>
        <button id="setBtn" class="btn ghost icon-btn" data-act="tab" data-v="set" title="설정" aria-label="설정"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="btn ghost" data-act="lock" title="잠그고 이 기기의 기억을 해제합니다">잠금</button>
      </div>
    </div>
    <nav id="tabs" class="tabs" aria-label="메뉴"></nav>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
