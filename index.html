<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; connect-src 'self' https://scanner.tradingview.com https://api.coinbase.com https://api.github.com; base-uri 'none'; form-action 'none'">
<title>내 포트폴리오</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M8 21l5-6 4 3 7-9' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f9f9f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="포트폴리오">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<section id="lock" class="lock">
  <form id="lockForm" class="lock-card" autocomplete="on" hidden>
    <h1>내 포트폴리오</h1>
    <p id="lockHint" class="muted"></p>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호" required>
    <input id="pw2" type="password" placeholder="비밀번호 확인" autocomplete="new-password" aria-label="비밀번호 확인" hidden>
    <label class="chk"><input id="remember" type="checkbox" checked>이 기기에서 기억하기</label>
    <button id="lockBtn" class="btn primary" type="submit">열기</button>
    <p id="lockErr" class="err" role="alert"></p>
    <label id="restoreWrap" class="linkish" hidden>백업 파일로 복원<input id="restoreFile" type="file" accept=".json,application/json" hidden></label>
  </form>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="top-row">
      <strong class="brand">내 포트폴리오</strong>
      <div class="top-right">
        <span id="fxBadge" class="fx"></span>
        <div class="seg" role="group" aria-label="표시 통화">
          <button data-act="cur" data-v="KRW">₩ 원화</button>
          <button data-act="cur" data-v="USD">$ 달러</button>
        </div>
        <button class="btn ghost" data-act="lock" title="잠그고 이 기기의 기억을 해제합니다">잠금</button>
      </div>
    </div>
    <nav id="tabs" class="tabs" aria-label="메뉴"></nav>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<script src="app.js"></script>
</body>
</html>
